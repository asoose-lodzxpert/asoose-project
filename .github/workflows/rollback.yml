name: Rollback Backend

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      # 1. Download last successful SHA artifact
      - name: Download last successful SHA
        uses: actions/download-artifact@v3
        with:
          name: last-successful-sha
          path: .

      - name: Read SHA
        id: sha
        run: echo "SHA=$(cat last_successful_sha.txt)" >> $GITHUB_ENV

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Deploy previous SHA to Railway
      - name: Rollback to last good SHA
        run: |
          echo "Rolling back to SHA $SHA"
          railway up --project YOUR_PROJECT_ID --token ${{ secrets.RAILWAY_TOKEN }} --docker-image yourdockerhubusername/yourapp:$SHA
