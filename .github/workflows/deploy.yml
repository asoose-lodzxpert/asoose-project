name: Deploy Backend

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image with SHA tag
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: asooselodzxpert/asoose-backend:${{ github.sha }}

      # 4. (Optional) Test Docker image
      # Uncomment and configure if needed
      # - name: Test Docker image
      #   run: |
      #     ...

      # 5. Push Docker image after verification
      - name: Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            asooselodzxpert/asoose-backend:latest
            asooselodzxpert/asoose-backend:${{ github.sha }}

      # 6. Save SHA as artifact for rollback
      - name: Save deployment SHA
        run: echo "${GITHUB_SHA}" > last_successful_sha.txt
      - name: Upload deployment SHA
        uses: actions/upload-artifact@v4
        with:
          name: last-successful-sha
          path: last_successful_sha.txt
