# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asoose-redis
  namespace: asoose
  labels:
    app: asoose-redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asoose-redis
  template:
    metadata:
      labels:
        app: asoose-redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: asoose-redis-service
  namespace: asoose
  labels:
    app: asoose-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: asoose-redis
---
# Redis PersistentVolumeClaim (using EBS)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: asoose
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3 # AWS EBS GP3 storage class
  resources:
    requests:
      storage: 10Gi
