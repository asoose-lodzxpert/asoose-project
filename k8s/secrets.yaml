# Secrets for sensitive data
# Note: Base64 encode all values before applying
# Example: echo -n "your-secret" | base64
apiVersion: v1
kind: Secret
metadata:
  name: asoose-backend-secrets
  namespace: asoose
type: Opaque
data:
  # Database credentials (base64 encoded)
  POSTGRES_USER: YXNvb3Nl # asoose
  POSTGRES_PASSWORD: YXNvb3NlX3Bhc3N3b3Jk # asoose_password

  # Redis password (base64 encoded)
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ= # redis_password

  # JWT secrets (base64 encoded) - CHANGE THESE IN PRODUCTION
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
  JWT_REFRESH_SECRET: eW91ci1zdXBlci1zZWNyZXQtcmVmcmVzaC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=

  # Email credentials (base64 encoded) - UPDATE WITH YOUR VALUES
  EMAIL_HOST: c210cC5nYW1haWwuY29t # smtp.gmail.com
  EMAIL_USER: eW91ci1lbWFpbEBnbWFpbC5jb20= # your-email@gmail.com
  EMAIL_PASSWORD: eW91ci1lbWFpbC1wYXNzd29yZA== # your-email-password
  EMAIL_FROM: bm9yZXBseUBhc29vc2UuY29t # noreply@asoose.com

  # Supabase credentials (base64 encoded) - UPDATE WITH YOUR VALUES
  SUPABASE_URL: aHR0cHM6Ly95b3VyLXByb2plY3Quc3VwYWJhc2UuY28= # https://your-project.supabase.co
  SUPABASE_KEY: eW91ci1zdXBhYmFzZS1hbm9uLWtleQ== # your-supabase-anon-key

---
# External Secrets Operator configuration (recommended for production)
# This will sync secrets from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: asoose
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: asoose-backend-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: asoose-backend-external-secrets
  namespace: asoose
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: asoose-backend-secrets-from-aws
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: asoose/backend/secrets # AWS Secrets Manager secret name
