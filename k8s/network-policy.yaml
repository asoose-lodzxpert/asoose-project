# Network Policy for Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asoose-backend-netpol
  namespace: asoose
spec:
  podSelector:
    matchLabels:
      app: asoose-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ALB/Ingress
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              app: asoose-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow RDS (PostgreSQL)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Allow HTTPS for external services (Supabase, Email, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587
---
# Network Policy for Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asoose-redis-netpol
  namespace: asoose
spec:
  podSelector:
    matchLabels:
      app: asoose-redis
  policyTypes:
    - Ingress
  ingress:
    # Only allow traffic from backend
    - from:
        - podSelector:
            matchLabels:
              app: asoose-backend
      ports:
        - protocol: TCP
          port: 6379
