# Service Account for Backend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: asoose-backend-sa
  namespace: asoose
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/asoose-backend-role
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asoose-backend
  namespace: asoose
  labels:
    app: asoose-backend
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: asoose-backend
  template:
    metadata:
      labels:
        app: asoose-backend
        tier: api
    spec:
      serviceAccountName: asoose-backend-sa
      containers:
        - name: backend
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/asoose-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            # ConfigMap values
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: NODE_ENV
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: REDIS_PORT
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: JWT_EXPIRES_IN
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: JWT_REFRESH_EXPIRES_IN
            - name: EMAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: EMAIL_PORT
            - name: SUPABASE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: SUPABASE_BUCKET

            # Secret values
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: JWT_REFRESH_SECRET
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: EMAIL_HOST
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: EMAIL_USER
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: EMAIL_PASSWORD
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: EMAIL_FROM
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: asoose-backend-secrets
                  key: SUPABASE_KEY

            # Constructed DATABASE_URL
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?schema=public"
            - name: DIRECT_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?schema=public"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: asoose-backend-config
                  key: DB_NAME

          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: asoose-backend-service
  namespace: asoose
  labels:
    app: asoose-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: asoose-backend
