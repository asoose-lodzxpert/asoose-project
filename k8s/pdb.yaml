# Pod Disruption Budget for Backend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: asoose-backend-pdb
  namespace: asoose
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: asoose-backend
---
# Pod Disruption Budget for Redis
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: asoose-redis-pdb
  namespace: asoose
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: asoose-redis
